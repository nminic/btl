services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definisi u .env fajlu}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-btl}
      MYSQL_USER: ${MYSQL_USER:-btl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?definisi u .env fajlu}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    profiles: ["full"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-btl}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-btl}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    profiles: ["full"]
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

volumes:
  mysql-data:
