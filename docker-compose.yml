services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-btl}
      POSTGRES_USER: ${POSTGRES_USER:-btl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in the .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btl} -d ${POSTGRES_DB:-btl}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-btl}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-btl}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    profiles: ["full"]
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres-data:
