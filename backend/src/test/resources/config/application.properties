# EVERY TEST CONTEXT, AND ONLY TESTS: the three hourly allowances of `AttemptsAtTheDoor`, raised out
# of reach.
#
# Spring Boot reads `classpath:/config/application.properties` on top of `classpath:/application.properties`,
# so these three lines override the shipped numbers and nothing else. They exist because a test context
# is shared by every class with the same settings and lives for the whole run, and every MockMvc request
# comes from 127.0.0.1: at the shipped five an hour, the sixth registration anywhere in a shared context
# would be refused, and which case met it would depend on the order the classes ran in.
#
# THE SHIPPED NUMBERS ARE STILL WHAT IS MEASURED. `AttemptsAtTheDoorTest` reads them out of
# `src/main/resources/application.properties` and puts them back for its own context, so the limit a
# case meets there is the limit QA and production meet, and changing that file changes what it measures.
btl.attempts.registrations-per-hour=1000000
btl.attempts.confirmation-letters-per-hour=1000000
btl.attempts.new-password-letters-per-hour=1000000
