spring.application.name=backend

# THE ADDRESS THE PORTAL WRITES FROM. `no-reply@` and not `info@`, because `info@`
# is read by a person and this one refuses everything that comes back to it.
#
# THE HYPHEN IS THE WHOLE ADDRESS, not a detail of spelling. The relay lets a
# sender through only when that exact address is verified in its panel, and rewrites
# every other one to a name of its own - so the portal configured with `noreply@`
# does not send late mail, it sends mail that arrives from a stranger nobody
# recognises. Measured 13.09.2026: with the unhyphenated form here, a test message
# arrived from an address on the relay's own domain. `no-reply@` is what stands
# verified, with DKIM and DMARC, and it is what ADL A48 of 12.09.2026 decides. An
# older note (ADL-posta, 29.07.2026) wrote the address without the hyphen; that form
# is overturned and the reason above is what survives it.
#
# It is a setting rather than a constant because QA and production are two
# installations of one portal. `PostmanTest` reads THIS file and compares it against
# the address a message actually leaves with, so the two cannot drift apart.
btl.mail.from=no-reply@balkanskatrkackaliga.net

# WHERE MAIL GOES, and these two are a DEVELOPMENT default pointing at nothing.
# Port 1025 on this machine is where a local mail catcher listens; with nothing
# there, a send fails loudly the moment somebody asks for one, which is the right
# answer on a developer's machine.
#
# QA and production override both through the environment, SPRING_MAIL_HOST and
# the rest, out of `deploy/.env`. THE KEY IS NEVER IN THIS FILE and never in the
# repository: it is generated in the Brevo panel, shown once, and kept in the
# owner's password manager.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# AND THE TWO SWITCHES BELOW ARE NOT SET HERE, on purpose.
#
# `starttls.required` is a different switch from `starttls.enable`, and a security
# round on 12.09.2026 measured what the difference costs: `enable` alone means
# "use STARTTLS if the server offers it", so somebody on the wire who strips it
# out of the server's greeting gets the connection to continue in the clear - and
# with authentication on, the relay's key goes out in Base64 on that same clear
# connection. Proven both ways: without `required` a message to a server offering
# no STARTTLS arrives in the clear with no error; with it, the send fails and
# nothing leaves the machine.
#
# Setting `required=true` here would be the obvious fix and it is the wrong one:
# it applies whether or not `enable` is on, so it would break the local catcher
# this file points at, and a developer would turn it off again.
#
# So the rule is enforced where it cannot be forgotten instead: `Postman` refuses
# to start when the portal is configured to send credentials without requiring
# TLS. Development sends none and is untouched; QA and production send them and
# must set both switches, which `deploy/compose.qa.yml` does.

# And the relay is given a deadline, because the alternative is a request that
# hangs until somebody notices. Brevo answers in tens of milliseconds; five
# seconds is far past anything healthy and far short of a member giving up.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# AND THE RELAY IS NOT PART OF WHETHER THE PORTAL IS HEALTHY.
#
# The mail starter brings a health indicator that opens a connection to the relay,
# and Spring folds it into the aggregate that `/actuator/health` answers with. That
# answer is what the container's own probe reads: with the relay unreachable the
# endpoint returns 503, Docker calls the container unhealthy, and QA never comes up
# - because of a service the portal does not need in order to serve a single page.
#
# Measured 12.09.2026, the moment the starter was added: the case that exists for
# exactly this (`theHealthCheckIsStillReachableByTheProbeThatWatchesIt`) went red
# on the first run.
#
# So the portal is healthy when it can answer, and a relay that is down is a
# failure at the moment somebody asks for a message to go - which is thrown, and
# belongs to whoever asked, not to a supervisor deciding whether to restart.
management.health.mail.enabled=false
