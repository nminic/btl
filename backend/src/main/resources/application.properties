spring.application.name=backend

# THE ADDRESS THE PORTAL WRITES FROM. `no-reply@` and not `info@`, because `info@`
# is read by a person and this one refuses everything that comes back to it.
#
# THE HYPHEN IS THE WHOLE ADDRESS, not a detail of spelling. The relay lets a
# sender through only when that exact address is verified in its panel, and rewrites
# every other one to a name of its own - so the portal configured with `noreply@`
# does not send late mail, it sends mail that arrives from a stranger nobody
# recognises. Measured 13.09.2026: with the unhyphenated form here, a test message
# arrived from an address on the relay's own domain. `no-reply@` is what stands
# verified, with DKIM and DMARC, and it is what ADL A48 of 12.09.2026 decides. An
# older note (ADL-posta, 29.07.2026) wrote the address without the hyphen; that form
# is overturned and the reason above is what survives it.
#
# It is a setting rather than a constant because QA and production are two
# installations of one portal. `PostmanTest` reads THIS file and compares it against
# the address a message actually leaves with, so the two cannot drift apart.
btl.mail.from=no-reply@balkanskatrkackaliga.net

# WHERE THE PORTAL LIVES, which is what the link in a message hangs off.
#
# It is a SETTING and never the host of the incoming request, and that is a security
# decision rather than a tidiness one. `WhatTheMessageSays` writes it out: a request's
# host is written by whoever sent it, so somebody asking the portal to register or to
# reset a password with a host of his own would have the portal mail a link to HIS
# machine, and the person who clicks it hands him the token. Read from here, the
# address cannot be influenced by anything that arrives over the wire.
#
# `WhatTheMessageSays.Portal` refuses everything that is not the shape of a portal
# address - https, no trailing slash, printable ASCII, no `@` - and it refuses it in
# the constructor of every class that reads this setting (`RegistrationApi`, and
# since B66 `EmailConfirmationApi` and `PasswordResetApi` beside it), so an
# installation configured with rubbish does not start rather than sending links
# nobody can use.
#
# THIS FILE CARRIES PRODUCTION and QA overrides it through the environment, the same
# arrangement `btl.mail.from` above uses: QA and production are two installations of
# one portal, `deploy/compose.qa.yml` sets BTL_PORTAL_ADDRESS to the qa host, and a QA
# installation that did not would mail its testers links into production.
btl.portal.address=https://balkanskatrkackaliga.net

# WHERE THE PICTURES ARE, which is a folder on the server's own disk.
#
# ADL A36 O8: „Fajl na disku servera pod imenom koje izdaje baza", and ADL A41 of
# 11.09.2026 settles where that disk is: „Imenovan Docker volumen uz bazu, montiran
# samo u bekend." A folder on the host outside Docker was offered and refused, and so
# was an outside service. `deploy/compose.qa.yml` mounts the volume at
# /var/lib/btl/photos and hands this setting that path; production does the same on the
# day it serves pictures.
#
# THE DEFAULT IS A DEVELOPER'S TEMPORARY FOLDER, and what it means is an EMPTY one.
# Nothing in this portal writes a picture yet, so on a machine that has uploaded none
# every address under /api/photos is an address that is not there - which is the true
# answer rather than a failure. It is the same shape as the mail settings below: a
# development default that points at nothing, so the case that matters shows itself on
# the developer's machine instead of only on a server.
#
# It is not `${...:}`-defaulted at the reader. `PhotoApi` asks for this key without a
# fallback, so an installation assembled without this file does not start - which is
# the right direction for a PATH: a wrong one answers 404 to every picture and looks
# exactly like a portal nobody has uploaded to.
btl.photos.folder=${java.io.tmpdir}/btl-photos

# WHERE MAIL GOES, and these two are a DEVELOPMENT default pointing at nothing.
# Port 1025 on this machine is where a local mail catcher listens; with nothing
# there, a send fails loudly the moment somebody asks for one, which is the right
# answer on a developer's machine.
#
# QA and production override both through the environment, SPRING_MAIL_HOST and
# the rest, out of `deploy/.env`. THE KEY IS NEVER IN THIS FILE and never in the
# repository: it is generated in the Brevo panel, shown once, and kept in the
# owner's password manager.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# AND THE TWO SWITCHES BELOW ARE NOT SET HERE, on purpose.
#
# `starttls.required` is a different switch from `starttls.enable`, and a security
# round on 12.09.2026 measured what the difference costs: `enable` alone means
# "use STARTTLS if the server offers it", so somebody on the wire who strips it
# out of the server's greeting gets the connection to continue in the clear - and
# with authentication on, the relay's key goes out in Base64 on that same clear
# connection. Proven both ways: without `required` a message to a server offering
# no STARTTLS arrives in the clear with no error; with it, the send fails and
# nothing leaves the machine.
#
# Setting `required=true` here would be the obvious fix and it is the wrong one:
# it applies whether or not `enable` is on, so it would break the local catcher
# this file points at, and a developer would turn it off again.
#
# So the rule is enforced where it cannot be forgotten instead: `Postman` refuses
# to start when the portal is configured to send credentials without requiring
# TLS. Development sends none and is untouched; QA and production send them and
# must set both switches, which `deploy/compose.qa.yml` does.

# And the relay is given a deadline, because the alternative is a request that
# hangs until somebody notices. Brevo answers in tens of milliseconds; five
# seconds is far past anything healthy and far short of a member giving up.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# AND THE RELAY IS NOT PART OF WHETHER THE PORTAL IS HEALTHY.
#
# The mail starter brings a health indicator that opens a connection to the relay,
# and Spring folds it into the aggregate that `/actuator/health` answers with. That
# answer is what the container's own probe reads: with the relay unreachable the
# endpoint returns 503, Docker calls the container unhealthy, and QA never comes up
# - because of a service the portal does not need in order to serve a single page.
#
# Measured 12.09.2026, the moment the starter was added: the case that exists for
# exactly this (`theHealthCheckIsStillReachableByTheProbeThatWatchesIt`) went red
# on the first run.
#
# So the portal is healthy when it can answer, and a relay that is down is a
# failure at the moment somebody asks for a message to go - which is thrown, and
# belongs to whoever asked, not to a supervisor deciding whether to restart.
management.health.mail.enabled=false

# WHO THE SUPERADMINS ARE, named by their addresses of electronic mail.
#
# The owner, 14.09.2026, choosing between naming an address, editing the database by
# hand, and building a screen (PDL P21, „Superadmin se ne pravi kroz portal"):
# „Superadmin se ne pravi kroz portal nego se imenuje adresom u podesavanjima
# servera." An account carrying a named address holds the role WHEN ITS ADDRESS IS
# CONFIRMED, and holds it for exactly as long as this setting names it: it is derived
# on every request and never written into a row, which is what makes „superadmin ne
# moze da se obrise ni razvlasti kroz portal" true by construction instead of by a
# check somebody has to remember to write.
#
# A LIST, COMMA SEPARATED, and that is the decision this setting carries out rather
# than a convenience: „superadminskih naloga sme da bude vise ... sprovodi se brojem
# adresa u podesavanjima, ne kucicama u portalu" (PDL P21). One address today, and
# „portal to ne ogranicava". The comma is the property binder's own spelling for a
# list, so it means the same thing here, in a -D on the command line, and in the
# environment variable BTL_SUPERADMIN_EMAIL the deploy stacks set.
#
# EMPTY HERE, AND THAT IS THE DECISION RATHER THAN A PLACEHOLDER WAITING TO BE FILLED.
# The addresses are people's and this repository is public, so they live in
# deploy/.env, which is gitignored, and reach the container as BTL_SUPERADMIN_EMAIL.
#
# AND THIS LINE IS WHAT LETS A PORTAL THAT NAMES NOBODY START, which is measurable and
# not a claim: declared here and empty, ${btl.superadmin.email} resolves for every
# context, with or without the empty default ApiSecurity writes on its placeholder.
# „Portal mora da radi normalno, bez superadmina, i bez pada."
#
# Unlike btl.portal.address above, this file carries NO production value, and the
# difference is not an oversight. That setting is what an installation IS, and the two
# installations differ; this one is WHO SOMEBODY IS, and a person's address belongs in
# the file nobody commits.
btl.superadmin.email=

# HOW BIG A FILE THE CONTAINER LETS THROUGH, AND IT IS DELIBERATELY NOT THE PORTAL'S OWN
# LIMIT.
#
# `MePhotoApi` is the first route in this portal that is handed a file, and
# `WhatAPictureIs.AT_MOST_BYTES` is the number a member is refused by, with a sentence he can
# act on. These two are the floor UNDER that, and they are set above it on purpose: written
# below it, every refusal would come from the container and the portal's own number would
# never decide anything, which is a limit nobody could reason about.
#
# The distance between them is one megabyte, which is the multipart wrapper rather than a
# margin for taste: a part carries its own headers and its boundary, and the request carries
# the three crop fractions beside it.
#
# Spring's own defaults are 1MB for a file and 10MB for a request - so without these lines an
# ordinary photograph from a telephone would be refused by the container before it reached a
# line anybody wrote. `MePhotoApiTest.theContainerLetsThroughMoreThanThePortalTakes` reads
# both numbers rather than trusting this paragraph.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# AND WHERE THE BYTES WAIT WHILE THE REQUEST IS BEING READ.
#
# Nought, which means every uploaded part goes to a temporary file rather than being held in
# the heap. The alternative is a threshold in kilobytes, which buys a little speed on small
# files and buys it by letting a request decide how much memory the portal uses: ten people
# sending five megabytes at once is fifty megabytes of heap that nothing is waiting on,
# because this portal hashes the file and writes it to disk rather than serving it back.
#
# What reads it is `MePhotoApi`'s own size check, which asks the PART how long it is before it
# reads a byte - so a file the portal is going to refuse is never held whole in memory either.
spring.servlet.multipart.file-size-threshold=0
