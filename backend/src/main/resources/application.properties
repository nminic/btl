spring.application.name=backend

# THE ADDRESS THE PORTAL WRITES FROM. `noreply@` and not `info@`, because `info@`
# is read by a person and this one refuses everything that comes back to it
# (ADL-posta, 29.07.2026). It is a setting rather than a constant because QA and
# production are two installations of one portal.
btl.mail.from=noreply@balkanskatrkackaliga.net

# WHERE MAIL GOES, and these two are a DEVELOPMENT default pointing at nothing.
# Port 1025 on this machine is where a local mail catcher listens; with nothing
# there, a send fails loudly the moment somebody asks for one, which is the right
# answer on a developer's machine.
#
# QA and production override both through the environment, SPRING_MAIL_HOST and
# the rest, out of `deploy/.env`. THE KEY IS NEVER IN THIS FILE and never in the
# repository: it is generated in the Brevo panel, shown once, and kept in the
# owner's password manager.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# And the relay is given a deadline, because the alternative is a request that
# hangs until somebody notices. Brevo answers in tens of milliseconds; five
# seconds is far past anything healthy and far short of a member giving up.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# AND THE RELAY IS NOT PART OF WHETHER THE PORTAL IS HEALTHY.
#
# The mail starter brings a health indicator that opens a connection to the relay,
# and Spring folds it into the aggregate that `/actuator/health` answers with. That
# answer is what the container's own probe reads: with the relay unreachable the
# endpoint returns 503, Docker calls the container unhealthy, and QA never comes up
# - because of a service the portal does not need in order to serve a single page.
#
# Measured 12.09.2026, the moment the starter was added: the case that exists for
# exactly this (`theHealthCheckIsStillReachableByTheProbeThatWatchesIt`) went red
# on the first run.
#
# So the portal is healthy when it can answer, and a relay that is down is a
# failure at the moment somebody asks for a message to go - which is thrown, and
# belongs to whoever asked, not to a supervisor deciding whether to restart.
management.health.mail.enabled=false
