# OBAVESTENJA O SOPSTVENOM REZULTATU, odvojen recnik od `notices/sr.properties`.
#
# Razlog je isti onaj zbog kog su obavestenja odvojena od `mail/sr.properties`, i nije
# uredjivanje nego pod: `WhatANoticeSaysTest.everyNoticeHasItsWordsAndEveryWordHasItsNotice`
# trazi da recnik bude TACNO kljucevi `Notice`-a, u oba smera, a
# `WhatAResultChangeSaysTest.everyOccasionHasItsWordsAndEveryWordHasItsOccasion` isto to
# trazi za svoj skup. Dva takva poda nad JEDNIM fajlom ne mogu oba da budu tacna, pa svaki
# skup dobija svoj recnik. Izmereno 25.09.2026 pri spajanju: oba poda su pala cim su se
# kljucevi nasli zajedno, i nijedna od dve grane to nije mogla da vidi sama.
#
# Sve ostalo iz `notices/sr.properties` vazi i ovde: nijedno obavestenje ne nosi vezu,
# broj rupa se mora poklopiti sa onim sto posiljalac prijavljuje, i apostrof se ne koristi.


# {0} je rezultat ispisan u jednom redu, {1} je nova vrednost tamo gde je ima.
# Brojevi se NIKAD ne kucaju ovde niti ih formatira MessageFormat: stižu kao
# gotov niz, jer bi ih MessageFormat ispisao po `Locale.ROOT` pa bi dužina u
# srpskoj rečenici stajala kao 42.2.

resultEntered.subject=Primili smo vaš rezultat
resultEntered.body=Primili smo rezultat koji ste poslali:\n\
\n\
{0}\n\
\n\
Bodovi su izračunati po javnoj formuli lige i ovde stoje kao račun. Prave bodove i promenu plasmana rezultat dobija tek kad ga moderator odobri.\n\
\n\
Sačuvajte ovu poruku. Portal ne čuva istoriju izmena, pa je ona jedini zapis o tome šta ste i kada poslali.\n\
\n\
Balkanska trkačka liga

