# DVE PORUKE SA STRANE DOGAĐAJA (PDL P9, 18.10.2026, „Unos rezultata sa strane događaja, za
# moderatora i administratora"). Kad moderator unese rezultat za sezonu u kojoj član ima
# članstvo, poruka je `resultApproved` iznad, jer je odluka „istu poruku kao kad mu moderator
# odobri rezultat". Ove dve su za ono što ta poruka ne kaže tačno: rezultat pre 2027 i izmenu koju je
# uradila liga. Poruka za godinu bez članstva je uklonjena: vlasnikovi kasniji odgovori su je
# učinili nedostižnom (tekuća sezona traži članstvo, zamrznuta ima svoju rečenicu). Reči su predlog; vlasnik ih pregleda
# uz PR („[OTVORENO 18.10.2026] Reči poruka ... predlog ide vlasniku sa PR-om").
#
# {0} je rezultat u jednom redu, {1} je godina kao gotov niz (ne broj, da je MessageFormat
# ne bi napisao kao 2.027) ili nova vrednost.

resultEnteredBeforeTheLeague.subject=Unet vam je rezultat
resultEnteredBeforeTheLeague.body=Liga vam je unela rezultat:\n\
\n\
