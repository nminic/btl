# PORUKA CLANU KAD MU ADMINISTRACIJA ISPRAVI PODATKE, odvojen recnik od ostalih u `notices/`.
#
# PDL, M7 (10.10.2026, vlasnik izabrao uz moju preporuku): „clan dobija poruku u sanduce kad mu
# administracija promeni podatke". Samo sanduce, bez mejla, i samo na srpskom, kao poruke o clanstvu.
# Reci pise agent, vlasnik ih menja na QA.
#
# `WhatADataCorrectionSaysTest` trazi da ovaj recnik bude TACNO kljucevi poruke i svakog polja
# `Field`, u oba smera, da telo ima tacno jednu rupu i da nijedna poruka ne nosi vezu.
# Apostrof se ne koristi, jer ga MessageFormat cita kao znak.
#
# {0} su imena izmenjenih podataka, vec spojena zarezom, recima ispod.

corrected.subject=Izmenjeni su vaši podaci
corrected.body=Administracija lige je izmenila vaše podatke: {0}.\n\
\n\
Balkanska trkačka liga

# Ime svakog podatka, onako kako ga clan cita u nabrajanju iznad.
field.firstName=ime
field.lastName=prezime
field.fatherName=ime oca
field.gender=pol
field.birthDate=datum rođenja
field.idNumber=broj ličnog dokumenta
field.email=adresa elektronske pošte
field.address=adresa
field.phone=telefon
field.town=mesto
field.shirtSize=veličina majice
