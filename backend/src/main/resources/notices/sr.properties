# OBAVEŠTENJA, koja javljaju da se nešto desilo i NE NOSE NIJEDNU VEZU.
#
# Odvojen rečnik od `mail/sr.properties`, i to nije uredništvo nego pod:
# `WhatTheMessageSaysTest.everyMessageHasItsWordsAndEveryWordHasItsMessage` traži
# da skup ključeva u `mail/sr` bude TAČNO jednak ključevima `Message`-a, u oba
# smera, i da svako telo ima mesto za vezu `{0}` i za njeno trajanje `{1}`.
# Obaveštenje nema ni jedno ni drugo, pa bi upisano tamo oborilo taj pod, a pod
# je tamo zato što poruka bez reči puca u najgorem trenutku.
#
# {0} je rezultat ispisan u jednom redu, {1} je nova vrednost tamo gde je ima.
# Brojevi se NIKAD ne kucaju ovde niti ih formatira MessageFormat: stižu kao
# gotov niz, jer bi ih MessageFormat ispisao po `Locale.ROOT` pa bi dužina u
# srpskoj rečenici stajala kao 42.2.
#
# Apostrof je u MessageFormat-u poseban znak i ovde se ne koristi.
#
# ZAŠTO SVE TRI PONAVLJAJU „sačuvajte ovu poruku": vlasnik, P22, „Mejl je dnevnik...
# obaveštenje mora da sadrži staru vrednost, jer ona nigde drugde ne preživljava."
# Poruka koja to ne kaže je dnevnik za koji čitalac ne zna da je dnevnik.

