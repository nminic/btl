# Obaveštenja: poruke koje javljaju da se nešto desilo i ne nose nijednu vezu.
#
# Odvojena su od `mail/sr.properties` zato što su tamošnje poruke sve redom veze
# ka ekranu, pa `WhatTheMessageSaysTest` traži da taj rečnik bude TAČNO ključevi
# `Message`-a, u oba smera. Ključ obaveštenja upisan tamo bi oborio taj pod.
# Ovde važi isto pravilo nad svojim skupom: `WhatANoticeSaysTest` traži da ovaj
# rečnik bude tačno ključevi `Notice`-a.
#
# Uređuje se kao proza, ne kao kod.
#
# NIJEDNO OBAVEŠTENJE NE SME DA NOSI VEZU. To nije stvar ukusa: obaveštenje stiže
# čoveku koji ništa nije tražio, pa je veza u njemu tačno ono čime bi ga neko
# prevario. Pod nad ovim fajlom formatira svaki tekst i traži da u njemu nema
# `://`.
#
# Broj rupa `{0}`, `{1}` mora da se poklopi sa onim što `Notice` prijavljuje da
# šalje. Ako se ne poklopi, build pada, umesto da članu stigne tekst sa `{1}` u
# sredini.
#
# Apostrof je u MessageFormat-u poseban znak i ovde se ne koristi.

# {0} je trenutak promene, {1} je koliko je drugih sesija odjavljeno.
#
# Stara lozinka se OVDE NE POMINJE i ne može da se pomene: portal je nema, čuva
# samo BCrypt otisak (V18). Odluka iz P9 da obaveštenje nosi staru vrednost je o
# administratoru koji menja tuđi REZULTAT, gde je stara vrednost staro vreme na
# trci, i na lozinku se ne prenosi.
thePasswordHasChanged.subject=Lozinka na vašem nalogu je promenjena
thePasswordHasChanged.body=Lozinka na vašem nalogu u Balkanskoj trkačkoj ligi promenjena je {0}.\n\
\n\
Tom promenom su odjavljeni svi ostali uređaji sa kojih ste bili prijavljeni, i na njima ćete ponovo morati da se prijavite, novom lozinkom.\n\
\n\
Broj tako odjavljenih uređaja: {1}.\n\
\n\
Ako ste ovo uradili vi, nemate šta dalje da uradite.\n\
\n\
Ako niste, neko drugi zna vašu staru lozinku. Odmah zatražite novu lozinku sa strane za prijavu i javite nam se na info@balkanskatrkackaliga.net.\n\
\n\
