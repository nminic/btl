# THE MESSAGES ABOUT A MEMBER'S OWN RESULT, IN ENGLISH, for the member who chose English
# for his mail. Edited as prose, not as code.
#
# The owner, 10.10.2026 (PDL, „Jezik mejlova (JM)", Q3): the inbox copy of these messages
# follows the language of the letter, and the rest of the inbox stays Serbian. And Q5: in
# an English letter the league signs as „Balkanska trkačka liga" and the prose calls it BTL.
#
# Everything `notices/results.properties` says holds here as well:
# `WhatAResultChangeSaysTest` requires this file to hold exactly the keys of `Told`, no
# message may carry a link, the holes must match what the sender says it sends, and the
# apostrophe is not used.
#
# {0} is the run written out in one line, {1} the new value where there is one. The
# figures are NEVER typed here nor formatted by MessageFormat: they arrive as a finished
# string, with the decimal point English writes.

resultEntered.subject=We have received your result
resultEntered.body=We have received the result you sent:\n\
\n\
{0}\n\
\n\
The points were worked out by the public formula of the league and are shown here as a calculation. The result gets its real points and its change of standing only once a moderator approves it.\n\
\n\
Balkanska trkačka liga

resultChanged.subject=We have received a change to your result
resultChanged.body=You have asked for a change to your result.\n\
\n\
Old value:\n\
{0}\n\
\n\
New value:\n\
{1}\n\
\n\
The old result stays in the standings while the change waits, and is replaced only once a moderator approves it.\n\
\n\
Balkanska trkačka liga

resultApproved.subject=Your result has been approved
resultApproved.body=A moderator has approved your result:\n\
\n\
{0}\n\
\n\
From now on the result counts in your profile, the rankings and the season table.\n\
\n\
Balkanska trkačka liga

resultDeleted.subject=Your result has been deleted
