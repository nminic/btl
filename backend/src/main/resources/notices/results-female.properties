#
# Vlasnik, 21.11.2026 (PDL, „Na sajtu se ne persira"), izabrao uz moju preporuku: „Mejlovi i poruke u
# sanduče idu po polu primaoca („potvrdio" ili „potvrdila"), jer pol znamo iz registracije." Muške reči
# su rečnik `results.properties`; ovde su samo ključevi čije se reči menjaju, jer pod nad onim rečnikom
# traži TAČNO ključeve `Told`. `WhatAResultChangeSaysTest` traži da svaki ključ odavde postoji tamo, da
# ima iste rupe i da se tekst razlikuje.
#
# Apostrof je u MessageFormat-u poseban znak i ovde se ne koristi.

