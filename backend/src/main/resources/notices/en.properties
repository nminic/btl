# The English words of the notices: messages that say something happened and carry no
# link. Edited as prose, not as code.
#
# Everything `notices/sr.properties` says holds here as well: `WhatANoticeSaysTest`
# requires this file to hold exactly the keys of `Notice`, requires that no notice carry
# `://`, and requires the holes `{0}`, `{1}` to match what `Notice` says it sends.
#
# The owner, 10.10.2026 (PDL, „Jezik mejlova (JM)"): in English prose the league is BTL.
#
# The apostrophe is a special character in MessageFormat and is not used here.

# {0} is the moment of the change, {1} is how many other sessions were ended.
#
# The old password is NOT mentioned here and cannot be: the portal does not have it and
# keeps only a BCrypt hash of it (V18).
thePasswordHasChanged.subject=The password of your account has changed
thePasswordHasChanged.body=The password of your BTL account was changed on {0}.\n\
\n\
That change signed out every other device you were signed in on, and on each of them you will have to sign in again, with the new password.\n\
\n\
Devices signed out this way: {1}.\n\
\n\
If it was you, there is nothing more you need to do.\n\
\n\
If it was not, somebody else knows your old password. Ask for a new password on the sign-in page at once and write to us at info@balkanskatrkackaliga.net.\n\
