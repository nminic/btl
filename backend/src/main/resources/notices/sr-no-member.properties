# OBAVEŠTENJE O PROMENI LOZINKE ZA NALOG KOJI NE IMENUJE ČLANA (administracija i moderator koji ne trči, V23).
#
# Vlasnik, 21.11.2026: „Samo nalozi bez profila. Neka za članove ostane kako jeste". Ovi nalozi nemaju pol ni u
# jednoj tabeli portala, pa im se piše na „ti" tekstom u kom nijedan glagol nema rod, isti za sve. Član dobija
# tekst iz `sr.properties`, nepromenjen. Rečnik je odvojen od `sr.properties` iz istog razloga iz kog je
# `mail/sr-no-member.properties` odvojen od `mail/sr.properties`: `WhatANoticeSaysTest` traži da `sr.properties`
# drži tačno ključeve `Notice`-a, a ovaj rečnik drži iste ključeve sa istim rupama.
#
# {0} je trenutak promene. Nikad veza (vidi `sr.properties`). Apostrof je u MessageFormat-u poseban znak i ovde
# se ne koristi.

thePasswordHasChanged.subject=Lozinka na tvom nalogu je promenjena
thePasswordHasChanged.body=Lozinka na tvom nalogu u Balkanskoj trkačkoj ligi promenjena je {0}.\n\
\n\
Nalog je odjavljen sa svih ostalih uređaja.\n\
\n\
