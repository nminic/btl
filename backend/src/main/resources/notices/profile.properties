# PORUKA CLANU KAD MU ADMINISTRACIJA PROMENI PROFILNU SLIKU ILI TEKST O SEBI, odvojen recnik od ostalih u `notices/`.
#
# PDL, 06.11.2026, „Boksovi „Profilna slika" i „Tekst o sebi" prelaze sa Podesavanja" (vlasnik izabrao uz moju
# preporuku): „Izmena administracije stupa odmah na profil, bez reda za proveru, i clan dobija poruku u sanduce da
# mu je administracija promenila sliku ili tekst o sebi". Samo sanduce, bez mejla, i samo na srpskom, kao poruke o
# podacima. Reci pise agent, vlasnik ih menja na QA.
#
# `WhatAProfileChangeSaysTest` trazi da ovaj recnik bude TACNO kljucevi svake izmene, u oba smera, da nijedna
# poruka nema rupu i da nijedna ne nosi vezu. Apostrof se ne koristi, jer ga MessageFormat cita kao znak.

picture.subject=Promenjena je vaša profilna slika
picture.body=Administracija lige je promenila vašu profilnu sliku. Nova slika već stoji na vašem profilu.\n\
\n\
Balkanska trkačka liga

words.subject=Promenjen je vaš tekst o sebi
words.body=Administracija lige je promenila vaš tekst o sebi. Promena već stoji na vašem profilu.\n\
\n\
