# PORUKE O CLANSTVU NA REDU CLANA, odvojen recnik od `notices/sr.properties` i
# `notices/results.properties`.
#
# Vlasnik, 18.10.2026 (PDL P8): upis uplate, promena osnova i storno stizu clanu kao poruka u
# portalskom sanducetu, sa sezonom i novim stanjem, bez mejla. Samo na srpskom, po odluci od
# 10.10.2026 (JM): u sanducetu samo kopija rezultatskih poruka prati jezik mejla, ostalo je srpsko.
#
# `WhatAMembershipChangeSaysTest` trazi da ovaj recnik bude TACNO kljucevi `Told` i `Basis`, u oba
# smera, da broj rupa bude onoliki koliko posiljalac salje, i da nijedna poruka ne nosi vezu.
# Apostrof se ne koristi, jer ga MessageFormat cita kao znak.
#
# {0} je sezona, vec ispisana kao niz. {1} je osnov na kom sezona sada stoji, recima ispod.

paymentRecorded.subject=Evidentirana je vaša uplata članarine
