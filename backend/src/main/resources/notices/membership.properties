# POCETNICKA KATEGORIJA KOJU JE UPIS ILI STORNO CLANSTVA ZATVORIO ODNOSNO PONOVO OTVORIO (PDL P7,
# 27.09.2026: ponisten izbor se javlja clanu, sa razlogom; PDL P4, 10.10.2026: u oba smera). Reci je
# vlasnik odobrio 19.10.2026, izabrao uz moju preporuku; potpis kao ostale poruke ovog recnika.
# {0} je sezona clanstva koje je upisano ili stornirano, {1} prag u bodovima, {2} sezona za koju se
# kategorija zatvara ili otvara, uvek naredna posle {0}. Sve tri su vec ispisane kao niz.

beginnersCategoryClosed.subject=Početnička kategorija vam je zatvorena
beginnersCategoryClosed.body=Upisana vam je članarina za sezonu {0}, pa se vaši odobreni rezultati iz te sezone računaju u zvaničnu sezonu. Time ste prešli prag od {1} bodova, pa vam je početnička kategorija zatvorena za sezonu {2}.\n\
\n\
Balkanska trkačka liga

beginnersCategoryReopened.subject=Početnička kategorija vam je ponovo otvorena
beginnersCategoryReopened.body=Poništena vam je članarina za sezonu {0}, pa se vaši rezultati iz te sezone više ne računaju u zvaničnu sezonu. Time ste pali ispod praga od {1} bodova, pa vam je početnička kategorija ponovo otvorena za sezonu {2}.\n\
\n\
Balkanska trkačka liga

