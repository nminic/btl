# Local development: PostgreSQL from docker-compose (service "postgres" on localhost:5432).
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:btl}
spring.datasource.username=${POSTGRES_USER:btl}
spring.datasource.password=${POSTGRES_PASSWORD:}
