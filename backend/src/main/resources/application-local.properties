# Lokalni razvoj: MySQL iz docker-compose (servis "mysql" na localhost:3306).
# Pokretanje: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE:btl}
spring.datasource.username=${MYSQL_USER:btl}
spring.datasource.password=${MYSQL_PASSWORD:}
