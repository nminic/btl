# sanduče idu po polu primaoca („potvrdio" ili „potvrdila"), jer pol znamo iz registracije." Muške reči
# su `sr.properties`; ovde su samo ključevi čije se reči menjaju, jer pod nad onim rečnikom traži TAČNO
