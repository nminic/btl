# The English words of the two messages that follow their reader's language. Edited as
# prose, not as code.
#
# The owner, 10.10.2026 (PDL, „Jezik mejlova (JM)"): in an English letter the league
# signs as „Balkanska trkačka liga" and the prose calls it BTL, as the English page does.
# The two invitations are always Serbian (Q4) and have no English words here, on purpose:
# `WhatTheMessageSaysTest` requires this file to hold exactly the messages that follow
# their reader, so an invitation written into it fails the build.
#
# {0} is the link and {1} is how long it lasts. The number is NEVER typed here: it comes
# from `WhatTheMessageSays.Message`, which `HowLongALinkLastsMatchesTheSchemaTest` ties to
# the column default the owner chose.
#
# The apostrophe is a special character in MessageFormat and is not used here.

confirmTheAddress.subject=Confirm your address
confirmTheAddress.body=Welcome to BTL.\n\
\n\
So that we know this address really is yours, open this link:\n\
{0}\n\
\n\
The link is valid for {1}. If you do not open it in that time, we delete your unfinished registration and this address stays free, so you can register again whenever you like.\n\
\n\
If you did not register with us, you can safely ignore this message, and in {1} there will be no trace of it left.\n\
\n\
Balkanska trkačka liga

setANewPassword.subject=Setting a new password
setANewPassword.body=We have received a request to set a new password for your account.\n\
\n\
Open this link and enter it:\n\
{0}\n\
\n\
The link is valid for {1} and can be used once.\n\
\n\
If you did not request a password change, you can safely ignore this message.\n\
\n\
Balkanska trkačka liga
