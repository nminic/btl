# THE LETTER AFTER THE ADDRESS IS CONFIRMED (owner, 23.10.2026 and 24.10.2026). The English
# is a translation of the Serbian, as the decision says, and the parameters are the ones
# `welcome.properties` names above its own copy. The purpose of the payment stays Serbian in both
# languages, because it is what the bank statement and the code carry.

welcomeWithASlip.subject=Payment slip for the {0} membership
welcomeWithASlip.body=Thank you for confirming your address, and welcome to BTL.\n\
\n\
To become a member of the league for {0}, all that is left is to pay the membership fee. The easiest way is to scan the QR code in the attachment with your banking app, and all the details fill in by themselves. If you would rather enter them by hand, here they are:\n\
\n\
Recipient: {1}\n\
Account: {2}\n\
Amount: {3}\n\
Purpose of payment: {4}\n\
\n\
Since you do not have a member number yet, the payment has no reference number. We will recognise it by your name, and as soon as it arrives, a moderator confirms it and you get your member number.\n\
\n\
The same details are always on the My membership page: {5}\n\
\n\
Balkanska trkačka liga
