welcomeWithPayPal.body=Thank you for confirming your address, and welcome to BTL.\n\
\n\
To become a member of the league for {0}, all that is left is to pay the membership fee through PayPal:\n\
\n\
PayPal address: {1}\n\
Amount (fee included): {2}\n\
\n\
The PayPal address is a business one, in the name of {4}. The fee is not part of the membership but what PayPal charges to process the payment. Any exchange rate difference and the charge of your bank are yours to bear.\n\
\n\
Since you do not have a member number yet, we will recognise the payment by your name, and as soon as it arrives, a moderator confirms it and you get your member number.\n\
\n\
The same details are always on the My membership page: {3}\n\
\n\
