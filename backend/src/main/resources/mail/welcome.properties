# PORUKA POSLE POTVRDE ADRESE (vlasnik, 23.10.2026, PDL „Poruka posle potvrde adrese i
# rok nedovrsene registracije"; reci D i E su vlasnikove, a B, C, F i G je izabrao uz moju
# preporuku, 23.10. i 24.10.2026). Sest poruka, i portal salje
# najvise jednu, i to samo onog trenutka kad je adresa potvrdjena prvi put. Koja je, bira
# `WhatTheWelcomeSays.Letter`.
#
# {0} je sezona u prodaji, uvek kao niz cifara. U B: {1} primalac, {2} racun, {3} iznos,
# {4} svrha uplate, {5} veza ka strani „Moja clanarina". U C: {1} PayPal adresa, {2}
# iznos sa taksom, {3} veza, {4} ime udruzenja na koje glasi PayPal adresa. U E i G: {1}
# veza. Primalac, racun i PayPal adresa se ovde ne
# kucaju: isti podaci idu i u QR kod, pa imaju jedan dom (`IpsSlip`).
#
# Crtica u D i F je vlasnikova i ostaje kakva jeste.
#
# Svoj recnik, a ne `sr.properties`, jer pod nad tim recnikom trazi da nosi tacno poruke sa
# vezom (`WhatTheMessageSaysTest`), a ovaj pod trazi tacno ovih sest (`WhatTheWelcomeSaysTest`):
# jedan recnik po podu, kao `notices/results.properties`. Engleski je `welcome-en.properties`.

welcomeWithASlip.subject=Uplatnica za članarinu za {0}. godinu
welcomeWithASlip.body=Hvala što ste potvrdili svoju adresu, dobrodošli u Balkansku trkačku ligu.\n\
\n\
Članarinu za {0}. godinu možete da uplatite skeniranjem QR koda iz priloga u aplikaciji svoje banke, ili ručno, sa ovim podacima:\n\
\n\
Primalac: {1}\n\
Račun: {2}\n\
Iznos: {3}\n\
Svrha uplate: {4}\n\
\n\
Uplata nema poziv na broj, jer članski broj još nemate. Članski broj dobijate kad uplata bude evidentirana.\n\
\n\
Iste podatke uvek možete naći i na strani Moja članarina: {5}\n\
\n\
Balkanska trkačka liga
