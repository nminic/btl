# Pozivnica clanu koga je administracija unela grupno, na osnovu papirne
# saglasnosti (vlasnik, 25.09.2026, PDL P8b; sprovodi PDL od 31.07.2026). Ista
# veza kao obnova lozinke, treci povod. Reci su svoje jer ovaj covek nije nista
# trazio, lozinku nema, a za razliku od moderatora VEC je u ligi: unet je i vidi
# se, samo jos ne moze da se prijavi. To mu se kaze, da poruka ne izgleda kao
# greska ili kao tudja.
#
# Recenicu o roku je vlasnik izabrao uz moju preporuku (PDL, 24.10.2026, odeljak o recenici
# pozivnice clana kog upise administracija); reci nisu njegove. Zamenila je recenicu o
# Zaboravljenoj lozinki: posle sedam
# dana bez lozinke upis se brise, pa nova veza sa strane za prijavu vise nije put. Njen
# prvi deo, da link vazi sedam dana i moze da se upotrebi jednom, vec je stajao ovde kao
# prva recenica, pa se ne ponavlja. Navodnika u ovom fajlu nema namerno:
# frontend/src/pages/account/forgottenPassword.test.tsx cita sve sto u njemu stoji pod
# navodnicima kao ime dugmeta koje poruke imenuju.
