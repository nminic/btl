# REČI KOJE ČITA ŽENA, samo tamo gde se razlikuju od `mail/welcome.properties`.
#
# Vlasnik, 21.11.2026 (PDL, „Na sajtu se ne persira"), izabrao uz moju preporuku: „Mejlovi i poruke u
# sanduče idu po polu primaoca („potvrdio" ili „potvrdila"), jer pol znamo iz registracije." Muške reči
# su `welcome.properties`; ovde su samo šest tela u kojima stoji „potvrdio" i „dobrodošao", jer pod nad
# onim rečnikom traži tačno ove ključeve. `WhatTheWelcomeSaysTest` traži da svaki ključ odavde postoji
# tamo, da ima iste rupe i da se tekst razlikuje.

welcomeWithASlip.body=Hvala što si potvrdila svoju adresu, dobrodošla u Balkansku trkačku ligu.\n\
\n\
Članarinu za {0}. godinu možeš da uplatiš skeniranjem QR koda iz priloga u aplikaciji svoje banke, ili ručno, sa ovim podacima:\n\
\n\
Primalac: {1}\n\
Račun: {2}\n\
Iznos: {3}\n\
Svrha uplate: {4}\n\
\n\
Uplata nema poziv na broj, jer članski broj još nemaš. Članski broj dobijaš kad uplata bude evidentirana.\n\
\n\
Iste podatke uvek možeš naći i na strani Moja članarina: {5}\n\
\n\
Balkanska trkačka liga

