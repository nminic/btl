# PORUKE ZA NALOG KOJI NE IMENUJE ČLANA (moderator koji ne trči, V23), jer taj nalog nema pol ni u jednoj tabeli
# portala. Dve poruke, obe od 22.11.2026 na „ti" tekstom bez roda: potvrda adrese (vlasnik, PDL, „Mejl za
# potvrdu adrese naloga bez profila", tekst odobren doslovno) i nova lozinka (od 21.11.2026; vlasnik: „Samo
# nalozi bez profila. Neka za članove ostane kako jeste", pa član i dalje dobija tekst iz `sr.properties`).
#
# Vlasnik, 21.11.2026 (PDL, „Na sajtu se ne persira"): poruke idu po polu primaoca, „jer pol znamo iz
# registracije". Nalog moderatora koji ne trči se ne registruje kroz formu, pa nema pola, i zato obe poruke
# ovde nose tekst bez roda, isti za sve primaoce.
# `WhatTheMessageSaysTest` traži da ovaj rečnik drži samo ključeve `confirmTheAddress` i `setANewPassword` i
# da su im rupe iste kao u `sr.properties`, a `NoMessageAddressesAMemberAsViTest` drži obe na „ti" i bez roda.
#
# Apostrof je u MessageFormat-u poseban znak i ovde se ne koristi.

confirmTheAddress.subject=Potvrdi svoju adresu
confirmTheAddress.body=Hvala na registraciji u Balkanskoj trkačkoj ligi.\n\
\n\
Adresu potvrđuješ otvaranjem ovog linka:\n\
{0}\n\
\n\
Link važi do {1}. Posle toga se nepotvrđena prijava briše, a sa ove adrese možeš da se registruješ ponovo.\n\
\n\
Ako ova registracija nije tvoja, zanemari ovu poruku.\n\
\n\
Balkanska trkačka liga

