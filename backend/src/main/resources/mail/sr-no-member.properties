# PORUKE ZA NALOG KOJI NE IMENUJE ČLANA (moderator koji ne trči, V23), jer taj nalog nema pol ni u jednoj tabeli
# portala. Dve poruke: potvrda adrese (reči koje je vlasnik odobrio, NEPROMENJENE, na „Vi") i nova lozinka
# (od 21.11.2026 na „ti" tekstom bez roda; vlasnik: „Samo nalozi bez profila. Neka za članove ostane kako
# jeste", pa član i dalje dobija tekst iz `sr.properties`).
#
# Vlasnik, 21.11.2026 (PDL, „Na sajtu se ne persira"): poruke idu po polu primaoca, „jer pol znamo iz
# registracije". Nalog moderatora koji ne trči se ne registruje kroz formu, pa nema pola, i šta mu portal
# piše na „ti" je vlasnikovo pitanje, postavljeno istog dana; do odgovora ostaje tekst kakav je bio.
# `WhatTheMessageSaysTest` traži da ovaj rečnik drži samo ključeve `confirmTheAddress` i da su im rupe iste
# kao u `sr.properties`, a `NoMessageAddressesAMemberAsViTest` drži potvrdu adrese na listi onoga što čeka.
#
# Apostrof je u MessageFormat-u poseban znak i ovde se ne koristi.

confirmTheAddress.subject=Potvrdite svoju adresu
confirmTheAddress.body=Dobrodošli u Balkansku trkačku ligu.\n\
\n\
Adresu potvrđujete otvaranjem ovog linka:\n\
{0}\n\
\n\
Link važi do {1}. Posle toga se nepotvrđena prijava briše, a sa ove adrese možete da se registrujete ponovo.\n\
\n\
Ako se niste registrovali kod nas, zanemarite ovu poruku.\n\
\n\
Balkanska trkačka liga

setANewPassword.subject=Postavljanje nove lozinke
setANewPassword.body=Stigao nam je zahtev da postaviš novu lozinku za svoj nalog.\n\
\n\
Otvori ovaj link i upiši je:\n\
{0}\n\
\n\
Link važi {1} i može da se upotrebi jednom.\n\
\n\
Ako zahtev nije stigao od tebe, zanemari ovu poruku.\n\
\n\
Balkanska trkačka liga
