# POTVRDA ADRESE ZA NALOG KOJI NE IMENUJE ČLANA (moderator koji ne trči, V23): reči koje je vlasnik odobrio,
# NEPROMENJENE, jer taj nalog nema pol ni u jednoj tabeli portala.
#
# Vlasnik, 21.11.2026 (PDL, „Na sajtu se ne persira"): poruke idu po polu primaoca, „jer pol znamo iz
# registracije". Nalog moderatora koji ne trči se ne registruje kroz formu, pa nema pola, i šta mu portal
# piše na „ti" je vlasnikovo pitanje, postavljeno istog dana; do odgovora ostaje tekst kakav je bio.
# `WhatTheMessageSaysTest` traži da ovaj rečnik drži samo ključeve `confirmTheAddress` i da su im rupe iste
# kao u `sr.properties`, a `NoMessageAddressesAMemberAsViTest` ga drži na listi onoga što čeka.
#
# Apostrof je u MessageFormat-u poseban znak i ovde se ne koristi.

