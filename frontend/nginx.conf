# WHO IS ASKING, when the only thing that can reach this container is a proxy.
#
# Nothing publishes a port for this service: the shared edge proxy reaches it over
# a Docker network and nothing else can. So `$remote_addr` is always the proxy, and
# a rate limit keyed on it would put every visitor in the world into one bucket and
# throttle them as one person. That is a worse bug than the one being fixed.
#
# The client address therefore comes off `X-Forwarded-For`, and it is trusted ONLY
# from the private ranges Docker hands out, which is the only path that exists.
# `real_ip_recursive` walks past the proxies we trust to the first address we do
# not, which is whoever called the edge proxy. ~~which is the visitor.~~ It is not the
# visitor, and the block below says who it is (21.11.2026).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# AND WHO THAT FIRST UNTRUSTED ADDRESS IS: CLOUDFLARE, FOR EVERY VISITOR THERE IS.
#
# The site is behind Cloudflare's proxy (ADL: „Cloudflare proxy je UKLJUČEN"), so the edge proxy's
# own caller is a Cloudflare machine and not the visitor, and the edge proxy carries no
# `trusted_proxies` (read on the host 21.11.2026: `/opt/edge/sites/btl.caddy` is `reverse_proxy
# frontend:80`, the cache rules and the four headers, and nothing else). So the address the block
# above arrives at is Cloudflare's, and until 21.11.2026 every zone below was keyed on it: a few of
# Cloudflare's machines in Belgrade shared one allowance between every visitor they carried.
#
# The visitor is in `CF-Connecting-IP`, which Cloudflare writes on every request it passes on. IT IS
# BELIEVED ONLY FROM CLOUDFLARE'S OWN ADDRESSES, which is what keeps it from being written by anybody
# else: a request that reaches the server some other way carries whatever `CF-Connecting-IP` its
# sender likes, and is then counted by the address the edge proxy saw it come from. The ranges are
# Cloudflare's published lists (https://www.cloudflare.com/ips-v4 and /ips-v6, read 21.11.2026), and
# they are the one thing here that has to be kept up by hand: a range Cloudflare adds is a range
# whose visitors are counted as Cloudflare until it is added here, which is the old behaviour and not
# a hole. Nothing on the edge proxy was changed for this, and nothing needs to be.
#
# `$btl_client` is the answer, and it is what every zone below is keyed on and what
# `nginx-to-backend.conf` hands the backend as `X-Btl-Client-Address` (`AttemptsAtTheDoor`).
# `TheProxyInFrontOfThePortalTest` runs this file in a real nginx and asks it, both ways round.
geo $btl_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Cloudflare's word when it came from Cloudflare and said something; otherwise the address itself.
map "$btl_from_cloudflare:$http_cf_connecting_ip" $btl_client {
    "~^1:(.+)$" $1;
    default $remote_addr;
}

# WHAT A PAGE OF THIS PORTAL MAY LOAD, AND IT IS ONLY ITS OWN (ADL, 23.08.2026: „`Content-Security-Policy`
# treba da postoji na edge-u"; set in this file rather than on the shared edge proxy, coordinator
# 21.11.2026, because here it is in the repository, under a test, and moves with the script it names).
#
# Measured 21.11.2026 against the source and against the page production serves: one module and two
# stylesheets of the portal's own, no third party at all (ADL A9: nothing is measured through anybody else), no font files, no frame,
# every request to `/api` on the same origin. Pictures come from `/api/photos` and from `data:` twice:
# the preview of a picture being cut (`CropChooser`, `readAsDataURL`) and the drawing behind a race
# (`RaceInMotion.css`, `mask-image`). Styles React writes through `style={}` go through the CSSOM, and
# so do ProseMirror's (`style.cssText`), which a policy does not stop, so there is no `'unsafe-inline'`
# anywhere.
#
# NO INLINE SCRIPT IS ALLOWED, and no digest of one. The one there was (the theme before the first
# paint) left `index.html` on 24.11.2026 with the light theme (PDL „Portal ima samo tamnu temu; svetla
# se izbacuje"), and its digest with it. `contentSecurityPolicy.test.ts` holds the page and this policy
# together in both directions, so a script put back into the page is refused by the test before it is
# refused by a browser.
#
# A variable and not the text twice, because a `location` that sets a header of its own inherits none
# of the server's: `/assets/` below sets `Cache-Control`, so it writes this one again, by name.
map $host $btl_content_security_policy {
    default "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
}

# SIGNING IN COSTS THE SERVER A FULL BCRYPT, AND IT COSTS IT EVEN WHEN NO SUCH
# ACCOUNT EXISTS.
#
# That is on purpose: answering faster for an address nobody has would tell an
# attacker which addresses are real. The price is that an anonymous request is the
# most expensive thing this portal does, measured at 42 ms on a fast desktop and
# more like 60 to 150 ms on the two core machine this runs on. Worse, the hashing
# happens inside a transaction that already holds a row lock, and the pool is ten
# connections, so a few dozen requests a second do not slow down signing in - they
# stop the whole portal, and every other site behind the same edge proxy with it.
#
# Until this session became reachable from the internet, QA sat behind basic auth
# and the question never arose. Production has no such door, so the limit is here.
#
# Ten a minute with a burst of five: somebody who mistypes their password five times
# in a row is not stopped, and the account itself locks after ten misses in fifteen
# minutes anyway. 429 rather than nginx's default 503, because the client is being
# asked to slow down and not told the server is broken.
limit_req_zone $btl_client zone=signin:10m rate=10r/m;

# AND REGISTERING COSTS MORE THAN SIGNING IN, ON TWO MACHINES INSTEAD OF ONE.
#
# It is the same bcrypt as above and then a round trip to somebody else's SMTP
# relay on top of it, and like signing in it is anonymous: the only thing an
# attacker needs is the XSRF cookie, which /api/places hands to anybody who asks.
# Measured 14.09.2026 against the real thing, one registration took 5175 ms while
# the relay was slow to answer.
#
# The transaction no longer waits for the relay, so a slow relay can no longer
# take the database with it - that was the worse half and it is fixed in
# RegistrationApi. What a limit is for is the half no code can fix: this route
# makes the portal SEND A LETTER TO AN ADDRESS THE CALLER NAMES, and a machine
# calling it in a loop is a machine posting mail from us to strangers until the
# relay stops trusting the domain. A blacklisted sender is not a slow portal, it
# is a portal whose members stop receiving anything at all.
#
# THIS IS NOT the general limit on requests the owner put off, and it is not the
# bot check PDL asks for either - a limit slows a machine down, it cannot tell one
# from a person. It is one route, in the shape the route above it already has.
#
# ITS OWN ZONE AND NOT `signin`, which would be cheaper and wrong: one bucket for
# both means a burst of registrations spends the allowance that is there so a
# member can get in, and the two have nothing to do with each other.
#
# Five a minute with a burst of three: registering is a thing a person does once,
# and three in a row covers the one honest case there is - a parent filling the
# form in for his children, one after another, from one address. A fourth waits
# twelve seconds. 429 for the same reason as above.
limit_req_zone $btl_client zone=registration:10m rate=5r/m;

# AND CHANGING A PASSWORD COSTS THE SAME BCRYPT, WITH A SESSION IN FRONT OF IT.
#
# `PUT /api/me/password` takes `for update` on the member's account row and hashes inside that
# transaction, in the branch that changes nothing as well (on purpose: the answer must not tell
# the two apart). Anybody signed in can therefore send ten of them in parallel from one account
# and hold the ten connections of the pool for as long as the hashing takes, and the whole portal
# waits, every other site behind the same edge proxy with it. Being signed in is not a limit.
#
# ITS OWN ZONE, for the reason registration has its own: the allowance that lets a member sign in
# is not spent by a member changing his password, and the other way round.
#
# Five a minute with a burst of three, which is MY REASONING and not an owner decision (ADL says
# nothing about this route): changing a password is something a member does once in a long while,
# and three in a row covers the honest case of a wrong current password corrected twice. A fourth
# waits twelve seconds. 429 for the same reason as above. The numbers are one line to change.
limit_req_zone $btl_client zone=password:10m rate=5r/m;

# AND DRAWING THE CARD A PROFILE IS SHARED WITH COSTS THE PROCESSOR, AND ANYBODY MAY ASK FOR IT.
#
# `GET /api/cards/competitor/...` reads the list of members, decodes a portrait and draws and
# compresses a picture of 1200 by 630 (CompetitorCards). A card already drawn is kept in memory and
# answered at once, but the name of a card carries a digest the caller may vary at will, and every
# variation of a real member's card is answered with the card as it stands, so it is the reading,
# not the drawing, that a loop can repeat. Nobody signed in asks for it: the asker is the crawler of
# a network or the phone a link was sent to.
#
# ITS OWN ZONE, for the reason registration has its own: a burst of previews when a link goes round
# a group spends nobody's allowance to sign in.
#
# Thirty a minute with a burst of twenty, which is MY REASONING and not an owner decision: a crawler
# asks once per address, a group of phones that all open one link at once is the honest burst, and
# twenty covers a large one. A twenty-first waits two seconds. 429 for the same reason as above. A
# prefix and not an exact match, because every card has its own address under this folder.
limit_req_zone $btl_client zone=cards:10m rate=30r/m;

limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every answer, the errors too (`always`); see the policy above for what it allows and why.
    add_header Content-Security-Policy $btl_content_security_policy always;

    # Without this the JSON goes over the wire raw. The result set alone is
    # over a megabyte and compresses to roughly a seventh of that, which is the
    # difference between a screen that appears and a screen that arrives.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Hashed asset names, so they can be cached forever. index.html never is,
    # or a deploy would leave visitors on the previous version.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $btl_content_security_policy always;
    }

    # SPA routes: all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # THE FALLBACK ITSELF, which every address that is not a profile and not under `/en` ends up at
    # (`/`, `/sr/...`, `/index.html`). SSI is on here too, and it has to be (owner, 21.11.2026): with SSI
    # off, the file goes out as it is written, and the English block of the front page, which only the
    # `/en` addresses may be sent, would be read as live tags by whoever reads the Serbian pages, next
    # to the Serbian ones. With it on, both blocks are taken out of the page and the include puts back
    # the one the stub names, the Serbian one, because no locale is set here and the folder asked is
    # the one that answers with no body.
    location = /index.html {
        ssi on;
        set $btl_preview_path /previews/none;
    }

    # THE PROFILE OF A MEMBER IS THE SAME PAGE, WITH WHAT A NETWORK SHOWS FOR IT WRITTEN IN.
    #
    # Owner, PDL P11, 15.11.2026: „Želim da funkcioniše tako kad samo iskopiram link i paste-ujem u
    # Viber, WhatsApp, Facebook i sl.” Facebook and Viber run no JavaScript, so they read index.html
    # as it leaves this server, and until now that was the front page's title and logo for every
    # profile. Here SSI is on, and index.html asks `/api/previews/competitor/<number>-<language>` for
    # the block that names the member and his card, in place of the front page's own block.
    #
    # The address is the one `profilePath` writes (`pages/profileAddress.ts`): the language, the
    # number, and anything after a dash, which is the name and which the profile does not read; the
    # number alone and a slash on the end open the same profile, so they are matched too. The tabs
    # under the profile (`/priznanja`, `/podaci`) are not, and keep the front page's block.
    #
    # Named captures and not $1, because the variable is read by the SSI include, which runs as the
    # file goes out, long after this match.
    location ~ "^/(?<btl_preview_locale>sr|en)/takmicar/(?<btl_preview_number>[0-9]{6})(?:-[^/]*)?/?$" {
        ssi on;
        set $btl_preview_path /api/previews/competitor/$btl_preview_number-$btl_preview_locale;
        try_files /index.html =404;
    }

    # EVERY OTHER ADDRESS UNDER `/en` IS THE SAME PAGE, WITH THE FRONT PAGE'S TAGS IN ENGLISH.
    #
    # Owner, 21.11.2026: a link to an English page, pasted into Viber or Facebook, showed the Serbian
    # title and description, and the link is shared to bring foreigners in. The networks run no script
    # and read index.html as it leaves here, which was Serbian for every address. After the profile
    # above, because the first regex that matches wins and a profile under `/en` has its own preview.
    #
    # SSI is on and `$btl_preview_locale` is `en`, so index.html picks the English block as the stub;
    # `$btl_preview_path` is a folder that answers with no body and asks nobody, because there is no
    # member to ask the backend about. Serbian addresses and `/` keep SSI off and the Serbian block.
    location ~ "^/en(?:/.*)?$" {
        ssi on;
        set $btl_preview_locale en;
        set $btl_preview_path /previews/none;
        try_files /index.html =404;
    }

    # THE ANSWER WITH NO BODY, so SSI puts the stub in. Internal, and no backend behind it.
    location = /previews/none {
        internal;
        return 204;
    }

    # AND THE BLOCK ITSELF, which only that include may ask for.
    #
    # `internal`, so nobody outside reaches the route: a request from the internet for this folder
    # never gets to the backend, and is answered with an empty 204, because the 404 of `internal`
    # passes through the `error_page` below like any other (measured 15.11.2026). The backend opens
    # the route to anybody all the same (ApiSecurity), so this is a second floor and not the only one.
    #
    # EVERY ANSWER THAT IS NOT A BLOCK BECOMES AN EMPTY ONE, and that is what makes the page work as
    # before when the backend has nothing to say or says nothing. SSI puts the front page's block in
    # (`stub` in index.html) ONLY when the answer has no body: measured on nginx 1.29 on 15.11.2026, a
    # 404 or a 500 with a body was put into the head of the page as it came, and so was nginx's own
    # 502 page when the backend was down. So every error, the backend's and nginx's, is turned into
    # a 204 here. The hidden profile, the lapsed member, the deleted one and the number nobody holds
    # are all the backend's 404, and therefore all one page to the byte.
    #
    # Short terms, which is MY REASONING and not an owner decision: a person opening a profile waits
    # for this answer before the page arrives, so a backend that is down or slow costs him at most
    # about a second and then he gets the page as it was. Measured on 15.11.2026 with the backend
    # stopped: 1.0 s with `resolver_timeout 1s`, 4.0 s without it.
    #
    # No compression asked of the backend, because what comes back is written into a page as it is;
    # and no cookie of the reader's passed on, because the block is the same for every reader (the
    # backend reads the profile as a visitor whoever asks) and a session has nothing to do here.
    location /api/previews/ {
        internal;
        include /etc/nginx/nginx-to-backend.conf;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        resolver_timeout 1s;
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 300 301 302 303 304 307 308 400 401 403 404 405 406 408 409 410 411 413 414 415 429 500 501 502 503 504 = @no-preview;
    }

    location @no-preview {
        return 204;
    }

    # Signing in, rate limited. An exact match, so it wins over the prefix below
    # without depending on the order the two are written in.
    location = /api/sign-in {
        limit_req zone=signin burst=5 nodelay;
        include /etc/nginx/nginx-to-backend.conf;
    }

    # Registering, rate limited too, and for the reasons beside its zone above: the
    # same bcrypt, a letter to an address the caller names, and nobody signed in.
    # An exact match for the same reason as the block above it.
    location = /api/registration {
        limit_req zone=registration burst=3 nodelay;
        include /etc/nginx/nginx-to-backend.conf;
    }

    # Changing the password, rate limited too: the same bcrypt behind a row lock, for the reasons
    # beside its zone above. An exact match, so no other method or sub-path is limited by accident
    # and this one cannot be reached around by the prefix below.
    location = /api/me/password {
        limit_req zone=password burst=3 nodelay;
        include /etc/nginx/nginx-to-backend.conf;
    }

    # The card a profile is shared with, rate limited: drawing it costs the processor and anybody may
    # ask, for the reasons beside its zone above. A prefix, longer than the one below, so it wins over
    # it whatever order the two are written in.
    location /api/cards/ {
        limit_req zone=cards burst=20 nodelay;
        include /etc/nginx/nginx-to-backend.conf;
    }

    # Everything else the backend answers.
    location /api/ {
        include /etc/nginx/nginx-to-backend.conf;
    }
}
