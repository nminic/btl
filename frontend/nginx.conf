server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Without this the JSON goes over the wire raw. The result set alone is
    # over a megabyte and compresses to roughly a seventh of that, which is the
    # difference between a screen that appears and a screen that arrives.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Hashed asset names, so they can be cached forever. index.html never is,
    # or a deploy would leave visitors on the previous version.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes: all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go to the backend service. The address is resolved at
    # runtime (Docker DNS), so nginx starts even when the backend
    # service is not up yet.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
