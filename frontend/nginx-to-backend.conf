# How a request reaches the backend, in one home.
#
# It lives in its own file because two locations need it: `/api/` for everything,
# and an exact `/api/sign-in` that adds a rate limit. Written twice they would
# drift, and the half that drifts would be the one nobody reads.
#
# The address is resolved at runtime (Docker DNS) through a variable, so nginx
# starts even when the backend service is not up yet.
resolver 127.0.0.11 valid=30s;
set $backend_upstream http://backend:8080;
proxy_pass $backend_upstream;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# THE FOURTH FLOOR OF A CHAIN OF THREE, AND UNTIL NOW THE ONE THAT ANSWERED FIRST.
#
# nginx's own default is one megabyte, and it sits in front of the other two floors, so
# it answered before either ever saw the request. Verified before this line existed:
# `grep -rn "client_max_body_size"` over the whole repository found nothing at all.
# `WhatAPictureIs.AT_MOST_BYTES` (backend/.../domain/photo/WhatAPictureIs.java) gives two
# to five megabytes as an ordinary telephone photograph's own size and is set to five for
# that reason; `application.properties` sets the container's limit to six, above it, for
# the reason written there. Left at nginx's default, a photograph anywhere from one to six
# megabytes never reached either sentence: nginx refused it first, in its own plain page,
# and the screen turned that into "Server je odgovorio brojem 413 ... Pokušaj ponovo za
# koji minut" (i18n/sr.json, server.wrong) - advice to retry an upload that could never
# have succeeded.
#
# Set above the container's six for the same reason the container is set above the
# portal's five: written the other way round, this layer decides instead, and it has no
# sentence of the portal's to hand back, only its own default error page.
# `MePhotoApiTest.theEdgeLetsThroughMoreThanTheContainerTakes` reads this file rather than
# trusting this paragraph, the way `theContainerLetsThroughMoreThanThePortalTakes` reads
# the settings rather than trusting the one above it.
#
# WHAT THIS DOES NOT ANSWER FOR: the shared edge proxy in front of this container
# (`/opt/edge`, Caddy, outside this repository - deploy/README.md) is one hop further
# upstream and may carry a body-size ceiling of its own. Nothing under `deploy/`
# configures that proxy and nothing in this repository can read it, so that floor is
# unmeasured rather than assumed to be high enough.
client_max_body_size 7m;
