<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- What the browser paints its own bar in: `--bg` of the portal's one theme,
         the dark one (styles/tokens.css), held to that token by app/oneTheme.test.ts.
         It said `#ffffff`, which put a white address bar above an almost black page
         on every Android phone. -->
    <meta name="theme-color" content="#060b16" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The defaults, which is what the home page says. Every screen replaces
         the title, the description, the canonical address, the hreflang pair and
         the Open Graph texts the moment React takes over (src/app/head.ts); these
         are what a reader sees in the tab in the meantime, and what a client that
         runs no JavaScript ends up with.

         EXCEPT ON THE PROFILE OF A MEMBER AND UNDER `/en`, and the lines of SSI around the
         block are why. For that one address nginx turns SSI on (nginx.conf, the
         location over `takmicar`) and puts in place of this block what the server
         says of that profile (CompetitorPreviewApi): the owner's title and the card
         of the member (PDL P11, 15.11.2026), because Facebook and Viber run no
         JavaScript and read this file as it is sent. When the server has nothing to
         say - a hidden profile, a lapsed member, a deleted one, a number nobody
         holds - or does not answer, nginx puts this very block back, so all of
         those read as the front page and as one another. On every other address
         SSI is on as well (21.11.2026) and the same lines put back the block of the language: under `/en`
         the English one, everywhere else the one above. SSI cannot be off anywhere, because the English
         block would then be read as live tags next to these.

         There is deliberately no canonical and no og:url here. This one file is
         served for every address on the portal, so a fixed canonical in it would
         tell a crawler that has not run our JavaScript that all fifty screens are
         copies of the home page, and a fixed og:url would make a shared link to a
         profile open the home page instead. Absent, both fall back to the address
         actually being read, which is right on every one of them. -->
    <!--# block name="front-page" -->
    <title>Balkanska trkačka liga - svaka trka se broji!</title>
    <meta
      name="description"
      content="Svaka trka se broji. Kalendar trka, tabela sezone, Top liste i profili takmičara Balkanske trkačke lige."
    />

    <!-- Link previews (Viber, WhatsApp, Facebook, Telegram, Slack). Absolute
         URLs are required: crawlers do not resolve relative paths. The
         512px icon doubles as the preview image: it is far larger than any
         preview renders, and staying near 250KB keeps WhatsApp, which drops
         previews for heavy images, working. Replace with a purpose-designed
         card here if one is ever produced. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Balkanska trkačka liga" />
    <meta property="og:title" content="Balkanska trkačka liga - svaka trka se broji!" />
    <meta
      property="og:description"
      content="Svaka trka se broji. Kalendar trka, tabela sezone, Top liste i profili takmičara Balkanske trkačke lige."
    />
    <meta property="og:locale" content="sr_RS" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:image" content="https://balkanskatrkackaliga.net/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo Balkanske trkačke lige" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Balkanska trkačka liga - svaka trka se broji!" />
    <meta
      name="twitter:description"
      content="Svaka trka se broji. Kalendar trka, tabela sezone, Top liste i profili takmičara Balkanske trkačke lige."
    />
    <meta name="twitter:image" content="https://balkanskatrkackaliga.net/icon-512.png" />
    <meta name="twitter:image:alt" content="Logo Balkanske trkačke lige" />
    <!--# endblock -->

    <!-- THE SAME BLOCK IN ENGLISH, for every address under `/en` (owner, 21.11.2026: a link to an English
         page shared on Viber, Facebook or WhatsApp showed the Serbian title and description, to people
         it was shared with to bring foreigners in). Same tags, same image, the words of
         `seo.home` in `en.json`, and `og:locale` `en_GB` with Serbian as the alternate.
         nginx.conf says which block is the stub: `$btl_preview_locale` is `en` under `/en`. -->
    <!--# block name="front-page-en" -->
    <title>Balkanska trkačka liga - every race counts!</title>
    <meta
      name="description"
      content="Every race counts. The race calendar, the season table, the Top boards and the competitor profiles of BTL."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Balkanska trkačka liga" />
    <meta property="og:title" content="Balkanska trkačka liga - every race counts!" />
    <meta
      property="og:description"
      content="Every race counts. The race calendar, the season table, the Top boards and the competitor profiles of BTL."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="sr_RS" />
    <meta property="og:image" content="https://balkanskatrkackaliga.net/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo of the Balkan Running League" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Balkanska trkačka liga - every race counts!" />
    <meta
      name="twitter:description"
      content="Every race counts. The race calendar, the season table, the Top boards and the competitor profiles of BTL."
    />
    <meta name="twitter:image" content="https://balkanskatrkackaliga.net/icon-512.png" />
    <meta name="twitter:image:alt" content="Logo of the Balkan Running League" />
    <!--# endblock -->
    <!--# if expr="$btl_preview_locale = en" -->
    <!--# include virtual="$btl_preview_path" stub="front-page-en" -->
    <!--# else -->
    <!--# include virtual="$btl_preview_path" stub="front-page" -->
    <!--# endif -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
