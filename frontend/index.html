<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Balkanska Trkačka Liga</title>
    <meta name="description" content="Balkanska trkačka liga. Portal je u izgradnji." />
    <link rel="canonical" href="https://balkanskatrkackaliga.net/" />

    <!-- Link previews (Viber, WhatsApp, Facebook, Telegram, Slack). Absolute
         URLs are required: crawlers do not resolve relative paths. The
         512px icon doubles as the preview image: it is far larger than any
         preview renders, and staying near 250KB keeps WhatsApp, which drops
         previews for heavy images, working. Replace with a purpose-designed
         card here if one is ever produced. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Balkanska trkačka liga" />
    <meta property="og:title" content="Balkanska trkačka liga" />
    <meta property="og:description" content="Portal je u izgradnji." />
    <meta property="og:url" content="https://balkanskatrkackaliga.net/" />
    <meta property="og:locale" content="sr_RS" />
    <meta property="og:image" content="https://balkanskatrkackaliga.net/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo Balkanske trkačke lige" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Balkanska trkačka liga" />
    <meta name="twitter:description" content="Portal je u izgradnji." />
    <meta name="twitter:image" content="https://balkanskatrkackaliga.net/icon-512.png" />
    <meta name="twitter:image:alt" content="Logo Balkanske trkačke lige" />

    <!-- Applies the stored theme before the first paint. React sets the same
         attribute, but it does so after mounting, which is one white flash too
         late for someone who chose the dark theme. -->
    <script>
      var btlTheme = localStorage.getItem('btl-theme')
      if (btlTheme === 'dark' || btlTheme === 'light') {
        document.documentElement.dataset.theme = btlTheme
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
