<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The defaults, which is what the home page says. Every screen replaces
         the title, the description, the canonical address, the hreflang pair and
         the Open Graph texts the moment React takes over (src/app/head.ts); these
         are what a reader sees in the tab in the meantime, and what a client that
         runs no JavaScript ends up with.

         There is deliberately no canonical and no og:url here. This one file is
         served for every address on the portal, so a fixed canonical in it would
         tell a crawler that has not run our JavaScript that all fifty screens are
         copies of the home page, and a fixed og:url would make a shared link to a
         profile open the home page instead. Absent, both fall back to the address
         actually being read, which is right on every one of them. -->
    <title>Balkanska trkačka liga - svaka trka se broji!</title>
    <meta
      name="description"
      content="Svaka trka se broji. Kalendar trka, tabela sezone, Top liste i profili takmičara Balkanske trkačke lige."
    />

    <!-- Link previews (Viber, WhatsApp, Facebook, Telegram, Slack). Absolute
         URLs are required: crawlers do not resolve relative paths. The
         512px icon doubles as the preview image: it is far larger than any
         preview renders, and staying near 250KB keeps WhatsApp, which drops
         previews for heavy images, working. Replace with a purpose-designed
         card here if one is ever produced. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Balkanska trkačka liga" />
    <meta property="og:title" content="Balkanska trkačka liga - svaka trka se broji!" />
    <meta
      property="og:description"
      content="Svaka trka se broji. Kalendar trka, tabela sezone, Top liste i profili takmičara Balkanske trkačke lige."
    />
    <meta property="og:locale" content="sr_RS" />
    <meta property="og:image" content="https://balkanskatrkackaliga.net/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo Balkanske trkačke lige" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Balkanska trkačka liga - svaka trka se broji!" />
    <meta
      name="twitter:description"
      content="Svaka trka se broji. Kalendar trka, tabela sezone, Top liste i profili takmičara Balkanske trkačke lige."
    />
    <meta name="twitter:image" content="https://balkanskatrkackaliga.net/icon-512.png" />
    <meta name="twitter:image:alt" content="Logo Balkanske trkačke lige" />

    <!-- Applies the theme before the first paint. React sets the same attribute,
         but it does so after mounting, which is one flash too late.

         The rule is written out rather than left to the stylesheet: dark unless
         the stored choice is „light", which is what app/themeContext.ts answers
         and therefore what the page ends up in. Set only for a stored value, this
         script left a visitor with nothing stored and a light system on the light
         palette for the first frame (tokens.css follows the system while
         data-theme is absent) and then moved them to dark on mount, which is the
         flash it exists to prevent. -->
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('btl-theme') === 'light' ? 'light' : 'dark'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
