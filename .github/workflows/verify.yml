name: Verifikacija

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (build, testovi, 100% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build i testovi (JaCoCo prag 100%)
        run: ./mvnw --batch-mode verify
      - name: Sačuvaj coverage izveštaj
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  frontend:
    name: Frontend (lint, testovi, 100% coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - name: Testovi sa coverage pragom 100%
        run: npm run test:coverage
      - run: npm run build
