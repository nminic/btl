name: Verifikacija

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (build, testovi, 100% coverage)
    runs-on: ubuntu-latest
    # About seven minutes on a good day. Without a ceiling, a run that waits on something outside
    # holds a runner for the six hours GitHub allows (09.10.2026: an image pull retried for 46
    # minutes before the run was cancelled).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The database image comes from a mirror and not from Docker Hub. On 09.10.2026 Docker Hub
      # refused the runners' anonymous pulls (`toomanyrequests`) or let its token service time out,
      # so every backend run retried `postgres:18` until it was cancelled. On that day both mirrors below served the same index
      # digest. Tagged `postgres:18`, it is the image `TestcontainersConfiguration` names, so
      # Testcontainers finds it present and asks no registry. The digest is printed so a change of
      # what the mirror serves is visible beside a change of outcome.
      - name: Slika baze sa ogledala
        run: |
          for mirror in mirror.gcr.io/library public.ecr.aws/docker/library; do
            if docker pull --quiet "$mirror/postgres:18"; then
              docker tag "$mirror/postgres:18" postgres:18
              docker image inspect --format '{{index .RepoDigests 0}}' postgres:18
              exit 0
            fi
          done
          exit 1
      - name: Build i testovi (JaCoCo prag 100%)
        # Ryuk, the container Testcontainers starts to clean up after the JVM, is pulled from
        # Docker Hub as well. A runner is thrown away when the job ends, so it has nothing to clean.
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: ./mvnw --batch-mode verify
      - name: Sačuvaj coverage izveštaj
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  frontend:
    name: Frontend (lint, testovi, 100% coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - name: Testovi sa coverage pragom 100%
        run: npm run test:coverage
      - run: npm run build
      # The guards that ask a real browser where things stand (ADL A63), over the build of the
      # step above. Chrome is the one the runner image carries and nothing is downloaded
      # (`channel: 'chrome'`, frontend/playwright.config.ts); the version is printed so a change
      # of image is visible beside a change of outcome.
      - name: Chrome na runneru
        run: google-chrome --version
      - name: Geometrija u pravom Chrome-u (ADL A63)
        run: npx playwright test
      - name: Sačuvaj ishod geometrije
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-geometry
          path: frontend/test-results
