name: Verifikacija

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (build, testovi, 100% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build i testovi (JaCoCo prag 100%)
        run: ./mvnw --batch-mode verify
      - name: Sačuvaj coverage izveštaj
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  frontend:
    name: Frontend (lint, testovi, 100% coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - name: Testovi sa coverage pragom 100%
        run: npm run test:coverage
      - run: npm run build
      # The guards that ask a real browser where things stand (ADL A63), over the build of the
      # step above. Chrome is the one the runner image carries and nothing is downloaded
      # (`channel: 'chrome'`, frontend/playwright.config.ts); the version is printed so a change
      # of image is visible beside a change of outcome.
      - name: Chrome na runneru
        run: google-chrome --version
      - name: Geometrija u pravom Chrome-u (ADL A63)
        run: npx playwright test
      - name: Sačuvaj ishod geometrije
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-geometry
          path: frontend/test-results
