name: Verifikacija

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (build, testovi, 100% coverage)
    runs-on: ubuntu-latest
    # About seven minutes on a good day. Without a ceiling, a run that waits on something outside
    # holds a runner for the six hours GitHub allows (09.10.2026: an image pull retried for 46
    # minutes before the run was cancelled).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The database image comes from a mirror and not from Docker Hub. On 09.10.2026 Docker Hub
      # refused the runners' anonymous pulls (`toomanyrequests`) or let its token service time out,
      # so every backend run retried `postgres:18` until it was cancelled. On that day both mirrors below served the same index
      # digest. Tagged `postgres:18`, it is the image `TestcontainersConfiguration` names, so
      # Testcontainers finds it present and asks no registry. The digest is printed so a change of
      # what the mirror serves is visible beside a change of outcome.
      - name: Slika baze sa ogledala
        run: |
          for mirror in mirror.gcr.io/library public.ecr.aws/docker/library; do
            if docker pull --quiet "$mirror/postgres:18"; then
              docker tag "$mirror/postgres:18" postgres:18
              docker image inspect --format '{{index .RepoDigests 0}}' postgres:18
              exit 0
            fi
          done
          exit 1
      - name: Build i testovi (JaCoCo prag 100%)
        # Ryuk, the container Testcontainers starts to clean up after the JVM, is pulled from
        # Docker Hub as well. A runner is thrown away when the job ends, so it has nothing to clean.
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: ./mvnw --batch-mode verify
      - name: Sačuvaj coverage izveštaj
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  # The frontend gate is three jobs that run side by side and one job that waits for them
  # (ADL A-CI, 30.10.2026). Before, it was five steps one after the other on one runner: about 46
  # minutes (measured 30.10.2026, report b279), of which the Vitest pass with coverage was about
  # 15.5, the same suite read as the other day about 11, and the Playwright geometry about 19.4.
  # Nothing is skipped and nothing is loosened: every step that was there is in one of the three
  # jobs with the same command, and the number of workers is the one each tool picks by itself.
  frontend-tests:
    name: Frontend - lint, testovi, 100% coverage, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      # `npm run test:coverage` is `vitest run --coverage && npm run test:another-day`, and that
      # stays the one command of the full gate on a machine. Here its first half runs on its own,
      # with the same threshold (vite.config.ts), because its second half is the job below.
      - name: Testovi sa coverage pragom 100%
        run: npx vitest run --coverage
      - run: npm run build

  frontend-another-day:
    name: Frontend - isti testovi, drugi dan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      # The second half of `npm run test:coverage`, by the very script it calls
      # (frontend/vitest.anotherDay.config.ts). No coverage here: the thresholds are measured once.
      - run: exit 1
      - name: Testovi sa drugim danom
        run: npm run test:another-day

  frontend-geometry:
    name: Frontend - build, geometrija u pravom Chrome-u
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      # The guards that ask a real browser where things stand (ADL A63), over the build of the
      # step above. Chrome is the one the runner image carries and nothing is downloaded
      # (`channel: 'chrome'`, frontend/playwright.config.ts); the version is printed so a change
      # of image is visible beside a change of outcome.
      - name: Chrome na runneru
        run: google-chrome --version
      - name: Geometrija u pravom Chrome-u (ADL A63)
        run: npx playwright test
      - name: Sačuvaj ishod geometrije
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-geometry
          path: frontend/test-results

  # The name below is the one the rule of the `main` branch asks for as a required check, so it is
  # written exactly as it was and the rule is not touched. `if: always()` makes it run when a job
  # it waits for failed or was cancelled or skipped, and the test below makes it fail then: a job
  # that is skipped counts as a pass to GitHub, and a job that waits on a skipped one is skipped
  # too, so without this the gate would be green over a geometry that never ran.
  frontend:
    name: Frontend (lint, testovi, 100% coverage, build)
    runs-on: ubuntu-latest
    needs: [frontend-tests, frontend-another-day, frontend-geometry]
    if: always()
    steps:
      - name: Svaka tri posla moraju biti uspešna
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "frontend-tests, frontend-another-day, frontend-geometry: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A job did not succeed: $result"
              exit 1
            fi
          done
          [ "$(echo $RESULTS | wc -w)" -eq 3 ]
